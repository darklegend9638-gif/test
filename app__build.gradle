plugins { id 'com.android.application' }

android {
    namespace 'com.crystalaltar.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.crystalaltar.game"   // ← должен быть уникальным в Google Play
        minSdk 24
        targetSdk 36                            // требование Google Play с 31.08.2026
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
