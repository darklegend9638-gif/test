plugins { id 'com.android.application' }

android {
    namespace 'com.crystalaltar.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.crystalaltar.game"   // должен быть уникальным в Google Play
        minSdk 24
        targetSdk 36                            // требование Google Play с 31.08.2026
        def vc = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionCode vc
        versionName "1.0." + vc
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    // lint не должен ронять сборку из-за предупреждений
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
